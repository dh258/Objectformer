NUM_GPUS: 1
DATALOADER:
  BATCH_SIZE: 4  # Reduced for MVP (100 samples)
  NUM_WORKERS: 4
TRAIN:
  ENABLE: False  # Changed to True for fine-tuning
  MAX_EPOCH: 25  # Reduced for MVP fine-tuning
  AUTO_RESUME: True
  EVAL_PERIOD: 1
  CHECKPOINT_PERIOD: 1
  CHECKPOINT_PATH: ""
  CHECKPOINT_EPOCH_RESET: False
  AMP_ENABLE: False  # Disabled for stability on small batches
TEST:
  ENABLE: True  # Disable during training
  CHECKPOINT_PATH: 'objectformer_doc_tamper_adamw_ktp_partial_frozen/checkpoints/ckpt_epoch_00021.pyth'
  THRES: 0.4  # Lowered for conservative KYC flagging (minimize false negatives)
MODEL:
  MODEL_NAME: ObjectFormer
  INPLANES: 64
  PRETRAINED: "ckpt/casiav2_and_imd20_ep40_lr2.5e-4.pth"
  NUM_LAYERS: [1, 1, 3, 1]
  NUM_CHS: [96, 192, 384, 768]
  NUM_STRIDES: [1, 2, 2, 2]
  NUM_HEADS: [3, 6, 12, 24]
  NUM_PARTS: [64, 64, 64, 64]
  PATCH_SIZES: [8, 7, 7, 7]
  DROP_PATH: 0.1
  NUM_ENC_HEADS: [1, 3, 6, 12]
  NUM_CLASSES: 1
  FIND_UNUSED_PARAMETERS: False
OPTIMIZER:
  OPTIMIZER_METHOD: adamw
  BASE_LR: 0.00001  # Reduced 2x for fine-tuning
  ADAM_BETAS: [0.9, 0.999]
  EPS: 0.00000001
  WEIGHT_DECAY: 0.01  # Increased 100x for regularization
  AMSGRAD: False
  FREEZE_STRATEGY: freeze_stages_0_1_2  # Train layer_3 + heads for better feature learning
DATASET:
  DATASET_NAME: TamperingDataset
  ROOT_DIR: training_dataset
  TRAIN_SPLIT: train_split_rebalanced.txt
  VAL_SPLIT: val_split_rebalanced.txt
  TEST_SPLIT: test_split.txt
  RETURN_MASK: True
  IMG_SIZE: 320
  TRAIN_AUGMENTATIONS:
    COMPOSE:
      [
        Resize,
        RandomCrop,
        [
          RandomBrightnessContrast,
          HueSaturationValue,
          CLAHE
        ],
        GaussNoise,
        ImageCompression,
        Normalize
      ]
    RESIZE_PARAMS: [380, 380]
    RANDOMCROP_PARAMS: [320, 320]
    IMAGECOMPRESSION_PARAMS: [65, 80]
    NORMALIZE_PARAMS: [[0.485, 0.456, 0.406], [0.229, 0.224, 0.225]]
  
  TEST_AUGMENTATIONS:
    COMPOSE: [Resize, Normalize]
    RESIZE_PARAMS: [320, 320]
    NORMALIZE_PARAMS: [[0.485, 0.456, 0.406], [0.229, 0.224, 0.225]]

SCHEDULER:
  SCHEDULER_TYPE: step
  DECAY_EPOCHS: 1000
  DECAY_RATE: 1.0
  WARMUP_LR: 0
  WARMUP_EPOCHS: 0

OUTPUT_DIR: 'objectformer_doc_tamper_adamw_ktp_partial_frozen'